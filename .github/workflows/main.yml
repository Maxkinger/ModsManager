name: Build Electron App

on:
  push:
    branches: [ "main", "master" ] # 监听主分支的推送

jobs:
  build:
    runs-on: windows-latest # 指定在 Windows 云服务器上编译

    steps:
    - name: 获取源码
      uses: actions/checkout@v4

    - name: 配置 Node.js 环境
      uses: actions/setup-node@v4
      with:
        node-version: '20' # 可修改为你本地使用的 Node 版本

    - name: 安装依赖
      run: npm install

    - name: 执行打包编译
      run: npm run build # 确保 package.json 中有这个指令，通常会调用 electron-builder

    - name: 提取编译生成的 EXE 文件
      uses: actions/upload-artifact@v4
      with:
        name: ModManager-Electron-Release
        path: dist/*.exe # 根据 electron-builder 实际输出的路径修改（如 dist, build, release）
