name: Build Electron App

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 获取源码
      uses: actions/checkout@v4

    - name: 配置 Node.js 环境
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 安装依赖
      run: npm install

    - name: 执行打包编译
      run: npm run dist

    - name: 提取编译生成的 EXE 文件
      uses: actions/upload-artifact@v4
      with:
        name: ModManager-Electron-Release
        path: release/*.exe
